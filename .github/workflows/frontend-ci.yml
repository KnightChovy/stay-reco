name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'packages/shared/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'packages/shared/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/shared/package-lock.json

      # postinstall builds packages/shared.
      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint

      # Generates Next's route types (PageProps, LayoutProps) so tsc can check without a full build.
      - name: Type-check
        run: npx next typegen && npx tsc --noEmit

      - name: Build
        run: npm run build
