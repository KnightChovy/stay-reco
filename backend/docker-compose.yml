services:
  postgres:
    image: postgres:17-alpine
    container_name: stayreco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayreco
      POSTGRES_PASSWORD: stayreco
      POSTGRES_DB: stayreco
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres-data:
