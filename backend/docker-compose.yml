# Temporary local database for development until the team database is ready.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: stayreco-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayreco
      POSTGRES_PASSWORD: stayreco
      POSTGRES_DB: stayreco
    ports:
      - '5432:5432'
    volumes:
      - stayreco_pg:/var/lib/postgresql/data
      # Creates the stayreco_test database used by the e2e tests.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  stayreco_pg:
